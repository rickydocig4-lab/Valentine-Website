<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Will You Be My Valentine, Smriti?</title>
    <!-- Tailwind Play CDN for development/demo purposes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #fff1f2;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        @keyframes shimmer {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .animate-float { animation: float 4s ease-in-out infinite; }
        .shimmer { animation: shimmer 2s ease-in-out infinite; }
        
        .heart-float {
            position: absolute;
            pointer-events: none;
            animation: floatUp 10s linear infinite;
            z-index: 0;
        }

        .bg-mesh {
            background-image: 
                radial-gradient(at 0% 0%, hsla(343,100%,76%,0.2) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(343,100%,76%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(343,100%,76%,0.2) 0, transparent 50%);
            background-attachment: fixed;
        }

        /* Custom Tailwind config for the font */
        html { font-family: 'Fredoka', sans-serif; }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
</head>
<body class="bg-mesh">
    <div id="root"></div>
    <!-- The index.tsx file is automatically imported by the environment -->
</body>
</html>
